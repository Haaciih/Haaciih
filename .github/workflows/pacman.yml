name: generate pacman animation

on:
  schedule:
    - cron: "0 */24 * * *" # Jalan otomatis tiap 24 jam
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Generate pacman dari kontribusi GitHub kamu
      - name: generate pacman-contribution-graph.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pacman-contribution-graph.svg
            dist/pacman-contribution-graph-dark.svg?palette=github-dark
            
      # Push hasil file SVG-nya ke branch khusus 'pacman-output'
      - name: push svg to pacman-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
